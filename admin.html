<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم نبضة</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF9FF;
    --panel:#FFFFFF;
    --ink:#1B1330;
    --ink-soft:#5B5470;
    --violet:#6C3CE9;
    --violet-deep:#4B21B8;
    --coral:#FF6A4D;
    --teal:#00C2A8;
    --sun:#FFC93C;
    --line:#EAE6F7;
    --shadow:0 20px 40px -20px rgba(76,33,184,0.25);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans Arabic', sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  h1,h2,h3{ font-family:'Tajawal', sans-serif; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }
  input, select{ font-family:inherit; }

  /* ===== Login screen ===== */
  .login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .login-card{
    background:var(--panel); border:1px solid var(--line); border-radius:24px; padding:36px;
    width:100%; max-width:400px; box-shadow:var(--shadow);
  }
  .login-card .logo-row{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .login-card .dot{
    width:12px; height:12px; border-radius:50%;
    background:linear-gradient(135deg, var(--violet), var(--coral));
  }
  .login-card h1{ font-size:20px; font-weight:900; }
  .login-card .sub{ font-size:13px; color:var(--ink-soft); margin-bottom:24px; }

  .field{ margin-bottom:16px; }
  .field label{ font-size:13px; font-weight:600; display:block; margin-bottom:6px; }
  .field input, .field select{
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
    font-size:14px; background:var(--bg); color:var(--ink);
  }
  .field input:focus, .field select:focus{ outline:2px solid var(--violet); outline-offset:1px; }

  .btn-primary{
    width:100%; background:var(--ink); color:#fff; padding:14px; border-radius:14px;
    font-weight:700; font-size:15px; transition:transform .15s ease;
  }
  .btn-primary:hover{ transform:translateY(-1px); }
  .btn-secondary{
    background:var(--panel); border:1px solid var(--line); padding:13px; border-radius:12px; font-weight:600;
  }
  .btn-danger-outline{
    background:transparent; color:var(--coral); border:1px solid var(--line); padding:10px 18px;
    border-radius:12px; font-weight:600; font-size:13px;
  }

  .error-msg{
    background:#FFF1EF; border:1px solid #FFD4CC; color:#B23A22; font-size:13px;
    padding:10px 14px; border-radius:10px; margin-bottom:16px; display:none;
  }
  .error-msg.show{ display:block; }

  /* ===== Dashboard shell ===== */
  .dash{ display:none; min-height:100vh; }
  .dash.show{ display:block; }
  .dash-topbar{
    position:sticky; top:0; z-index:10; background:var(--panel); border-bottom:1px solid var(--line);
    padding:16px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
  }
  .dash-topbar h1{ font-size:19px; display:flex; align-items:center; gap:8px; }
  .dash-topbar .dot{
    width:10px; height:10px; border-radius:50%;
    background:linear-gradient(135deg, var(--violet), var(--coral));
  }
  .dash-body{ max-width:960px; margin:0 auto; padding:26px 20px 60px; }
  .dash-note{
    font-size:12.5px; color:var(--ink-soft); background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:12px 16px; margin-bottom:20px;
  }
  .tabs{ display:flex; gap:10px; margin-bottom:24px; flex-wrap:wrap; }
  .tab-btn{
    padding:10px 20px; border-radius:12px; border:1px solid var(--line); font-weight:600; font-size:14px;
    background:var(--panel); position:relative;
  }
  .tab-btn.active{ background:var(--violet); color:#fff; border-color:var(--violet); }
  .tab-btn .badge-count{
    background:var(--coral); color:#fff; font-size:10.5px; font-weight:700; border-radius:999px;
    padding:1px 6px; margin-right:6px; font-family:'JetBrains Mono', monospace;
  }
  .tab-btn.active .badge-count{ background:rgba(255,255,255,0.3); }
  .tab-section{ display:none; }
  .tab-section.active{ display:block; }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px 18px;
    margin-bottom:12px;
  }
  .item-row{
    display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .item-left{ display:flex; align-items:center; gap:12px; }
  .swatch{ width:36px; height:36px; border-radius:10px; flex-shrink:0; }
  .item-row h4{ font-size:15px; font-weight:700; }
  .item-row .sub-line{ font-size:12px; color:var(--ink-soft); }
  .item-actions{ display:flex; gap:8px; }
  .icon-btn{
    width:34px; height:34px; border-radius:10px; border:1px solid var(--line); font-size:14px;
    display:flex; align-items:center; justify-content:center; background:var(--panel);
  }
  .icon-btn.danger:hover{ background:#FFECEA; border-color:var(--coral); }
  .icon-btn.edit:hover{ background:#F0EBFE; border-color:var(--violet); }

  .add-card{
    border:1.5px dashed var(--line); border-radius:16px; padding:18px; margin-bottom:14px; background:transparent;
  }
  .add-card h4{ margin-bottom:14px; font-size:15px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .color-presets{ display:flex; gap:10px; }
  .color-preset{
    width:30px; height:30px; border-radius:50%; border:2px solid transparent; cursor:pointer; transition:.15s ease;
  }
  .color-preset.selected{ border-color:var(--ink); transform:scale(1.12); }

  .empty-state{ text-align:center; color:var(--ink-soft); font-size:14px; padding:50px 20px; }

  /* ===== Order cards ===== */
  .order-card{
    background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:20px; margin-bottom:16px;
  }
  .order-head{
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;
    margin-bottom:14px; padding-bottom:14px; border-bottom:1px dashed var(--line);
  }
  .order-code{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:16px; }
  .order-date{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .status-pill{
    font-size:12px; font-weight:700; padding:5px 12px; border-radius:999px; background:var(--sun); color:#7A5400;
  }
  .status-pill.contacted{ background:#DFF4EE; color:#0A6B54; }
  .status-pill.done{ background:#E7E4FA; color:var(--violet-deep); }

  .order-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:14px; }
  @media (max-width:640px){ .order-grid{ grid-template-columns:1fr; } }
  .order-block h5{ font-size:12px; color:var(--ink-soft); font-weight:600; margin-bottom:8px; }
  .customer-line{ font-size:14px; font-weight:600; margin-bottom:4px; }
  .customer-sub{ font-size:13px; color:var(--ink-soft); margin-bottom:2px; }

  .contact-actions{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .contact-btn{
    display:flex; align-items:center; gap:6px; padding:9px 14px; border-radius:10px; font-size:13px; font-weight:600;
  }
  .contact-btn.call{ background:var(--violet); color:#fff; }
  .contact-btn.whatsapp{ background:#25D366; color:#fff; }

  .items-list{ display:flex; flex-direction:column; gap:6px; }
  .order-item-line{ display:flex; justify-content:space-between; font-size:13px; }
  .order-item-line span:first-child{ color:var(--ink-soft); }

  .order-foot{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
    padding-top:14px; border-top:1px dashed var(--line);
  }
  .order-total{ font-weight:700; font-size:16px; }
  .order-pay{ font-size:12.5px; color:var(--ink-soft); }
  .order-actions{ display:flex; gap:8px; align-items:center; }
  .status-select{
    padding:8px 12px; border-radius:10px; border:1px solid var(--line); font-size:13px; background:var(--bg);
  }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:14px 24px; border-radius:14px; font-size:14px; font-weight:600;
    z-index:200; opacity:0; transition:.25s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ===== Login screen ===== -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="logo-row"><span class="dot"></span><h1>لوحة تحكم نبضة</h1></div>
    <div class="sub">هاي الصفحة خاصة بصاحب المتجر فقط</div>
    <div class="error-msg" id="loginError"></div>
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input id="loginEmail" type="email" placeholder="owner@store.com">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input id="loginPass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter') doLogin();">
    </div>
    <button class="btn-primary" onclick="doLogin()">دخول</button>
  </div>
</div>

<!-- ===== Dashboard ===== -->
<div class="dash" id="dash">
  <div class="dash-topbar">
    <h1><span class="dot"></span> لوحة تحكم نبضة</h1>
    <div style="display:flex; gap:10px;">
      <button class="btn-danger-outline" onclick="doLogout()">تسجيل خروج</button>
      <a href="index.html" class="btn-secondary" style="display:inline-block;">🏬 عرض المتجر</a>
    </div>
  </div>

  <div class="dash-body">
    <div class="dash-note">أي تعديل هون بينحفظ على Firestore وبينعكس فورًا على المتجر لكل الزبائن.</div>

    <div class="tabs">
      <button class="tab-btn active" id="tabBtn-orders" onclick="switchTab('orders')">
        <span class="badge-count" id="ordersBadge">0</span> 📦 الطلبات
      </button>
      <button class="tab-btn" id="tabBtn-products" onclick="switchTab('products')">📱 المنتجات</button>
      <button class="tab-btn" id="tabBtn-categories" onclick="switchTab('categories')">🗂️ الأقسام</button>
    </div>

    <div class="tab-section active" id="sectionOrders"></div>
    <div class="tab-section" id="sectionProducts"></div>
    <div class="tab-section" id="sectionCategories"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* =====================================================================
   🔧 FIREBASE SETUP — must be the EXACT SAME config as in index.html
   (same Firebase project), since both files share one database.
===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyCMUBKn_pcfWAIHZ-wskknEL8UL3YhUjZM",
  authDomain: "nabda-store-4be15.firebaseapp.com",
  projectId: "nabda-store-4be15",
  storageBucket: "nabda-store-4be15.firebasestorage.app",
  messagingSenderId: "318901490815",
  appId: "1:318901490815:web:74f1bd10c03394466bdb4a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const productsCol = db.collection('products');
const categoriesCol = db.collection('categories');
const ordersCol = db.collection('orders');

/* =====================================================================
   🔧 CLOUDINARY SETUP — free image hosting, no credit card needed.
   1. Create a free account at https://cloudinary.com
   2. Copy your "Cloud name" from the dashboard
   3. Go to Settings (⚙️) → Upload → Upload presets → Add upload preset
      → set "Signing Mode" to "Unsigned" → Save → copy the preset name
===================================================================== */
const CLOUDINARY_CLOUD_NAME = "heqkzarp";
const CLOUDINARY_UPLOAD_PRESET = "nabda_products";

let PRODUCTS = [];
let CATS = [];
let ORDERS = [];
let activeTab = 'orders';
let editingProductId = null;
let selectedColorIdx = 0;

const COLOR_PRESETS = [
  {c1:'#6C3CE9', c2:'#4B21B8'},
  {c1:'#FF6A4D', c2:'#C23A1F'},
  {c1:'#00C2A8', c2:'#007F6E'},
  {c1:'#FFC93C', c2:'#D69A00'},
  {c1:'#FF3B5C', c2:'#8E0E2C'},
  {c1:'#8E8E93', c2:'#3A3A3C'},
];

/* Demo data used only when the admin clicks "seed" on an empty database */
const SEED_CATEGORIES = [
  {id:'apple', label:'آيفون'},
  {id:'samsung', label:'سامسونج'},
  {id:'huawei', label:'هواوي'},
  {id:'xiaomi', label:'شاومي'},
  {id:'redmi', label:'ريدمي'},
];
const SEED_PRODUCTS = [
  {id:1, name:'iPhone 15 Pro', tagline:'أداء استثنائي بهيكل تيتانيوم', cat:'apple', price:4899, color1:'#8E8E93', color2:'#3A3A3C', ram:8, storage:256, cam:48, battery:3274},
  {id:2, name:'iPhone 15', tagline:'تصميم أنيق وكاميرا مزدوجة متطورة', cat:'apple', price:3599, color1:'#FF6A4D', color2:'#C23A1F', ram:6, storage:128, cam:48, battery:3349},
  {id:3, name:'Galaxy S24 Ultra', tagline:'قلم ذكي وشاشة منحنية فائقة الوضوح', cat:'samsung', price:4599, color1:'#6C3CE9', color2:'#4B21B8', ram:12, storage:256, cam:200, battery:5000},
  {id:4, name:'Galaxy A55', tagline:'أداء متوازن للاستخدام اليومي', cat:'samsung', price:1699, color1:'#00C2A8', color2:'#007F6E', ram:8, storage:128, cam:50, battery:5000},
  {id:5, name:'Huawei P60 Pro', tagline:'كاميرا احترافية بتقنية الفتحة المتغيرة', cat:'huawei', price:3299, color1:'#FF3B5C', color2:'#8E0E2C', ram:8, storage:256, cam:48, battery:4815},
  {id:6, name:'Huawei Nova 12', tagline:'تصميم عصري وشحن سريع فائق', cat:'huawei', price:1599, color1:'#FFC93C', color2:'#D69A00', ram:8, storage:256, cam:50, battery:4500},
  {id:7, name:'Xiaomi 14 Pro', tagline:'شريحة رائدة وكاميرا مزدوجة احترافية', cat:'xiaomi', price:2999, color1:'#FF9500', color2:'#B25A00', ram:12, storage:256, cam:50, battery:4880},
  {id:8, name:'Xiaomi 13T', tagline:'أداء قوي بسعر منافس', cat:'xiaomi', price:1899, color1:'#FF9500', color2:'#6C3CE9', ram:12, storage:256, cam:50, battery:5000},
  {id:9, name:'Redmi Note 13 Pro', tagline:'الأفضل في فئته من حيث الكاميرا والسعر', cat:'redmi', price:1099, color1:'#00C2A8', color2:'#6C3CE9', ram:8, storage:256, cam:200, battery:5100},
  {id:10, name:'Redmi 13C', tagline:'خيار اقتصادي موثوق للاستخدام اليومي', cat:'redmi', price:649, color1:'#00C2A8', color2:'#007F6E', ram:6, storage:128, cam:50, battery:5000},
];

/* ===== Auth ===== */
auth.onAuthStateChanged(user => {
  if(user){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dash').classList.add('show');
    startSync();
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('dash').classList.remove('show');
  }
});

function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  errEl.classList.remove('show');
  if(!email || !pass){
    errEl.textContent = 'عبّي البريد وكلمة المرور';
    errEl.classList.add('show');
    return;
  }
  auth.signInWithEmailAndPassword(email, pass)
    .catch(err => {
      errEl.textContent = 'بيانات الدخول غير صحيحة';
      errEl.classList.add('show');
      console.error(err);
    });
}

function doLogout(){
  auth.signOut();
}

/* ===== Live sync (starts only after login) ===== */
let syncStarted = false;
function startSync(){
  if(syncStarted) return;
  syncStarted = true;

  categoriesCol.onSnapshot(snap => {
    CATS = snap.docs.map(d => ({id:d.id, ...d.data()}));
    if(activeTab === 'categories') renderCategories();
    if(activeTab === 'products') renderProducts();
  });

  productsCol.onSnapshot(snap => {
    PRODUCTS = snap.docs.map(d => ({id:d.id, ...d.data()}));
    if(activeTab === 'products') renderProducts();
    if(activeTab === 'categories') renderCategories();
  });

  ordersCol.orderBy('createdAt', 'desc').onSnapshot(snap => {
    ORDERS = snap.docs.map(d => ({id:d.id, ...d.data()}));
    document.getElementById('ordersBadge').textContent = ORDERS.filter(o => o.status === 'جديد').length;
    if(activeTab === 'orders') renderOrders();
  }, err => console.error('orders sync error:', err));

  renderOrders();
}

/* ===== Tabs ===== */
function switchTab(tab){
  activeTab = tab;
  ['orders','products','categories'].forEach(t => {
    document.getElementById('tabBtn-'+t).classList.toggle('active', t === tab);
    document.getElementById('section'+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle('active', t === tab);
  });
  if(tab === 'orders') renderOrders();
  if(tab === 'products') renderProducts();
  if(tab === 'categories') renderCategories();
}

function getCatLabel(catId){
  const c = CATS.find(cat => cat.id === catId);
  return c ? c.label : catId;
}

/* ===== Orders tab ===== */
function fmtDate(ts){
  if(!ts || !ts.toDate) return '—';
  const d = ts.toDate();
  return d.toLocaleDateString('ar-EG', {day:'numeric', month:'short'}) + ' · ' +
         d.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
}

function statusClass(status){
  if(status === 'تم التواصل') return 'contacted';
  if(status === 'مكتمل') return 'done';
  return '';
}

function waLink(phone){
  const digits = (phone || '').replace(/[^\d]/g, '');
  return 'https://wa.me/' + digits;
}

function renderOrders(){
  const el = document.getElementById('sectionOrders');
  if(ORDERS.length === 0){
    el.innerHTML = `<div class="empty-state">ولا طلب لسه. أول ما زبون يشتري من المتجر، رح يظهر هون فورًا 📬</div>`;
    return;
  }
  el.innerHTML = ORDERS.map(o => `
    <div class="order-card">
      <div class="order-head">
        <div>
          <div class="order-code">${o.orderCode || o.id}</div>
          <div class="order-date">${fmtDate(o.createdAt)}</div>
        </div>
        <span class="status-pill ${statusClass(o.status)}">${o.status || 'جديد'}</span>
      </div>

      <div class="order-grid">
        <div class="order-block">
          <h5>بيانات الزبون</h5>
          <div class="customer-line">${o.customerName || '—'}</div>
          <div class="customer-sub">📞 ${o.customerPhone || '—'}</div>
          <div class="customer-sub">📍 ${o.customerAddress || '—'}</div>
          <div class="contact-actions">
            <a class="contact-btn call" href="tel:${o.customerPhone || ''}">📞 اتصال</a>
            <a class="contact-btn whatsapp" href="${waLink(o.customerPhone)}" target="_blank" rel="noopener">💬 واتساب</a>
          </div>
        </div>
        <div class="order-block">
          <h5>الأجهزة المطلوبة</h5>
          <div class="items-list">
            ${(o.items || []).map(i => `
              <div class="order-item-line">
                <span>${i.name} × ${i.qty}</span>
                <span class="mono">${(i.price*i.qty).toLocaleString()} ر.س</span>
              </div>
            `).join('')}
          </div>
        </div>
      </div>

      <div class="order-foot">
        <div>
          <div class="order-total mono">${(o.total || 0).toLocaleString()} ر.س</div>
          <div class="order-pay">${o.paymentMethod === 'cod' ? '💵 الدفع عند الاستلام' : '💳 بطاقة ائتمان'}</div>
        </div>
        <div class="order-actions">
          <select class="status-select" onchange="updateOrderStatus('${o.id}', this.value)">
            <option value="جديد" ${o.status==='جديد'?'selected':''}>جديد</option>
            <option value="تم التواصل" ${o.status==='تم التواصل'?'selected':''}>تم التواصل</option>
            <option value="مكتمل" ${o.status==='مكتمل'?'selected':''}>مكتمل</option>
          </select>
          <button class="icon-btn danger" onclick="deleteOrder('${o.id}')" title="حذف">🗑️</button>
        </div>
      </div>
    </div>
  `).join('');
}

function updateOrderStatus(id, status){
  ordersCol.doc(id).update({status})
    .then(() => showToast('تم تحديث حالة الطلب ✅'))
    .catch(err => showToast('صار خطأ: ' + err.message));
}

function deleteOrder(id){
  if(!confirm('متأكد بدك تحذف هاد الطلب؟')) return;

    <div class="field">

      <input id="apImageFile" type="file" accept="image/*" onchange="handleImageFile(this.files[0])">
      <div id="imgStatus" style="font-size:12px; color:var(--ink-soft); margin-top:6px;"></div>
      <div id="imgPreviewWrap" style="margin-top:10px; display:flex; align-items:center; gap:10px; ${currentProductImage ? '' : 'display:none;'}">
        <img id="imgPreview" src="${currentProductImage}" style="max-width:100px; max-height:100px; border-radius:10px; border:1px solid var(--line);" onerror="this.style.display='none'" onload="this.style.display='block'">
        <button type="button" class="btn-secondary" style="padding:8px 14px; font-size:12px;" onclick="removeImage()">✕ إزالة الصورة</button>

    </div>
  `;
  renderColorPresets();
}

/* ===== Image upload: compress locally, then upload to Cloudinary (free image CDN) ===== */
let currentProductImage = '';
let isUploadingImage = false;
const MAX_IMAGE_BYTES = 150 * 1024;

function handleImageFile(file){
  if(!file) return;
  const statusEl = document.getElementById('imgStatus');
  const submitBtn = document.getElementById('submitProductBtn');
  isUploadingImage = true;
  if(submitBtn) submitBtn.disabled = true;
  statusEl.textContent = 'جاري ضغط الصورة...';

  compressImage(file, MAX_IMAGE_BYTES)
    .then(({dataUrl, bytes}) => {
      document.getElementById('imgPreview').src = dataUrl;
      document.getElementById('imgPreviewWrap').style.display = 'flex';
      statusEl.textContent = `تم الضغط إلى ${Math.round(bytes/1024)} كيلوبايت — جاري الرفع...`;
      return uploadToCloudinary(dataUrl);
    })
    .then(url => {
      currentProductImage = url;
      statusEl.textContent = 'تم رفع الصورة بنجاح ✅';
    })
    .catch(err => {
      statusEl.textContent = 'صار خطأ: ' + err.message;
      console.error(err);
    })
    .finally(() => {
      isUploadingImage = false;
      if(submitBtn) submitBtn.disabled = false;
    });
}

function uploadToCloudinary(dataUrl){
  if(CLOUDINARY_CLOUD_NAME === 'YOUR_CLOUD_NAME'){
    return Promise.reject(new Error('لسه ما ضفت إعدادات Cloudinary بالكود ⚠️'));
  }
  const formData = new FormData();
  formData.append('file', dataUrl);
  formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

  return fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
    method: 'POST',
    body: formData
  })
    .then(res => res.json())
    .then(data => {
      if(data.secure_url) return data.secure_url;
      throw new Error(data.error?.message || 'فشل رفع الصورة');
    });
}

function removeImage(){
  currentProductImage = '';
  document.getElementById('imgPreviewWrap').style.display = 'none';
  document.getElementById('imgStatus').textContent = '';
  const fileInput = document.getElementById('apImageFile');
  if(fileInput) fileInput.value = '';
}

function compressImage(file, maxBytes){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let width = img.width, height = img.height;
        const maxDim = 900;
        if(width > height){ if(width > maxDim){ height = Math.round(height * (maxDim/width)); width = maxDim; } }
        else { if(height > maxDim){ width = Math.round(width * (maxDim/height)); height = maxDim; } }

        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        let quality = 0.85;

        function attempt(){
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          const bytes = Math.round((dataUrl.length - 'data:image/jpeg;base64,'.length) * 0.75);

          if(bytes <= maxBytes){
            resolve({dataUrl, bytes});
            return;
          }
          if(quality > 0.35){
            quality -= 0.1;
          } else if(width > 250){
            width = Math.round(width * 0.85);
            height = Math.round(height * 0.85);
            canvas.width = width; canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);
            quality = 0.7;
          } else {
            // Can't shrink further — accept whatever we've got
            resolve({dataUrl, bytes});
            return;
          }
          setTimeout(attempt, 0);
        }
        attempt();
      };
      img.onerror = () => reject(new Error('تعذر تحميل الصورة'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('تعذر قراءة الملف'));
    reader.readAsDataURL(file);
  });
}

function renderColorPresets(){
  const el = document.getElementById('colorPresets');
  el.innerHTML = COLOR_PRESETS.map((c, i) => `
    <div class="color-preset ${i===selectedColorIdx?'selected':''}"
         style="background:linear-gradient(160deg, ${c.c1}, ${c.c2})"
         onclick="pickColor(${i})"></div>
  `).join('');
}

function pickColor(i){
  selectedColorIdx = i;
  renderColorPresets();
}

function editProduct(id){
  editingProductId = id;
  const p = PRODUCTS.find(pr => pr.id === id);
  const idx = COLOR_PRESETS.findIndex(c => c.c1 === p.color1);
  selectedColorIdx = idx === -1 ? 0 : idx;
  renderProductForm();
  document.getElementById('productForm').scrollIntoView({behavior:'smooth', block:'center'});
}

function cancelEdit(){
  editingProductId = null;
  selectedColorIdx = 0;
  renderProductForm();
}

function deleteProduct(id){
  const p = PRODUCTS.find(pr => pr.id === id);
  if(!confirm(`متأكد بدك تحذف "${p.name}"؟`)) return;
  productsCol.doc(id).delete()
    .then(() => showToast('تم حذف الجهاز 🗑️'))
    .catch(err => showToast('صار خطأ: ' + err.message));
}

function submitProduct(){
  if(isUploadingImage){
    showToast('لسه في صورة قيد الرفع، استنى ثانية ⏳');
    return;
  }
  const name = document.getElementById('apName').value.trim();
  const cat = document.getElementById('apCat').value;
  const tagline = document.getElementById('apTagline').value.trim() || 'جهاز جديد بمواصفات رائعة';
  const price = parseInt(document.getElementById('apPrice').value);
  const ram = parseInt(document.getElementById('apRam').value) || 8;
  const storage = parseInt(document.getElementById('apStorage').value) || 128;
  const cam = parseInt(document.getElementById('apCam').value) || 48;
  const battery = parseInt(document.getElementById('apBattery').value) || 5000;
  const image = currentProductImage;

  if(!name || !price){
    showToast('عبّي اسم الجهاز والسعر على الأقل ⚠️');
    return;
  }
  if(!cat){
    showToast('لازم تضيف قسم واحد على الأقل من تبويب الأقسام ⚠️');
    return;
  }

  const color = COLOR_PRESETS[selectedColorIdx];
  const data = {name, tagline, cat, price, color1:color.c1, color2:color.c2, ram, storage, cam, battery, image};

  const btn = document.getElementById('submitProductBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'جاري الحفظ...'; }

  const savePromise = editingProductId !== null
    ? productsCol.doc(editingProductId).update(data).then(() => showToast(`تم تحديث ${name} ✅`))
    : productsCol.add(data).then(() => showToast(`تمت إضافة ${name} ✅`));

  savePromise
    .then(() => { editingProductId = null; selectedColorIdx = 0; currentProductImage = ''; })
    .catch(err => {
      showToast('صار خطأ: ' + err.message);
      if(btn){ btn.disabled = false; btn.textContent = editingProductId !== null ? 'حفظ التعديلات' : 'إضافة الجهاز'; }
    });
}

/* ===== Categories tab ===== */
function categoryColor(catId){
  const p = PRODUCTS.find(pr => pr.cat === catId);
  return p ? p.color1 : '#B9B4D6';
}

function renderCategories(){
  const el = document.getElementById('sectionCategories');
  el.innerHTML = `
    <div class="add-card">
      <h4>➕ إضافة قسم جديد</h4>
      <div class="field-row">
        <div class="field"><input id="newCatLabel" placeholder="مثال: ون بلس"></div>
        <button class="btn-primary" style="flex:0 0 auto; width:auto; padding:0 22px;" onclick="addCategory()">إضافة</button>
      </div>
    </div>
    ${CATS.length === 0 ? `<div class="empty-state">ولا قسم لسه — ضيف قسم أو حمّل بيانات تجريبية من تبويب المنتجات</div>` : ''}
    ${CATS.map(c => {
      const count = PRODUCTS.filter(p => p.cat === c.id).length;
      return `
        <div class="card">
          <div class="item-row">
            <div class="item-left">
              <div class="swatch" style="background:${categoryColor(c.id)}"></div>
              <div>
                <h4>${c.label}</h4>
                <div class="sub-line">${count} جهاز</div>
              </div>
            </div>
            <div class="item-actions">
              <button class="icon-btn edit" onclick="editCategory('${c.id}')" title="تعديل">✏️</button>
              <button class="icon-btn danger" onclick="deleteCategory('${c.id}')" title="حذف">🗑️</button>
            </div>
          </div>
        </div>
      `;
    }).join('')}
  `;
}

function addCategory(){
  const input = document.getElementById('newCatLabel');
  const label = input.value.trim();
  if(!label){
    showToast('اكتب اسم القسم أولاً ⚠️');
    return;
  }
  const id = 'cat_' + Date.now();
  categoriesCol.doc(id).set({label})
    .then(() => showToast(`تمت إضافة قسم "${label}" ✅`))
    .catch(err => showToast('صار خطأ: ' + err.message));
}

function editCategory(id){
  const cat = CATS.find(c => c.id === id);
  const newLabel = prompt('اسم القسم الجديد:', cat.label);
  if(newLabel && newLabel.trim()){
    categoriesCol.doc(id).update({label:newLabel.trim()})
      .then(() => showToast('تم تحديث القسم ✅'))
      .catch(err => showToast('صار خطأ: ' + err.message));
  }
}

function deleteCategory(id){
  const count = PRODUCTS.filter(p => p.cat === id).length;
  if(count > 0){
    showToast(`ما فيك تحذف هاد القسم — فيه ${count} جهاز بعد ⚠️`);
    return;
  }
  if(!confirm('متأكد بدك تحذف هاد القسم؟')) return;
  categoriesCol.doc(id).delete()
    .then(() => showToast('تم حذف القسم 🗑️'))
    .catch(err => showToast('صار خطأ: ' + err.message));
}

/* ===== Seed demo data ===== */
function seedDatabase(){
  const batch = db.batch();
  SEED_CATEGORIES.forEach(c => batch.set(categoriesCol.doc(c.id), {label:c.label}));
  SEED_PRODUCTS.forEach(p => {
    const {id, ...rest} = p;
    batch.set(productsCol.doc(String(id)), rest);
  });
  batch.commit()
    .then(() => showToast('تم تحميل البيانات التجريبية ✅'))
    .catch(err => showToast('صار خطأ: ' + err.message));
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
